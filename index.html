<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    >

    <!-- Primary Meta Tags. These mirror the home page's own copy
         (translations `seo.home`) so the shell and the rendered page agree;
         scripts/prerender.ts rewrites them per route at build time. -->
    <title>Software Engineer &amp; Web Developer in Zürich | Dominik Könitzer</title>
    <meta
      name="title"
      content="Software Engineer &amp; Web Developer in Zürich | Dominik Könitzer"
    >
    <meta
      name="description"
      content="Dominik Könitzer, a software engineer in Zürich building web apps with React, TypeScript and Node. Live projects, source code and services."
    >
    <meta
      name="keywords"
      content="Dominik Könitzer, Dominik Konitzer, software engineer, web developer, React developer, TypeScript developer, full-stack developer, Switzerland, Swiss developer, web development services, frontend developer, backend developer, portfolio"
    >
    <meta name="author" content="Dominik Könitzer">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="generator" content="Vite + React">
    <meta name="format-detection" content="telephone=no">

    <!-- Robots & crawler directives (max snippet + image preview tells AI / SERPs to use full content) -->
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    >
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    >
    <meta
      name="bingbot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    >

    <!-- No preconnect / dns-prefetch hints on purpose: fonts (src/main.tsx),
         the /about avatar (public/avatar.jpg) and the contributions API (/api)
         are all same-origin, so there is no third-party origin worth warming.
         The production CSP in vercel.json only allows same-origin resources;
         adding a third-party script, image or fetch means extending it. -->

    <!-- Icons and PWA. SVG for modern browsers, favicon.ico as the raster
         fallback that Google's favicon crawler + legacy clients request by convention -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dominik Könitzer">
    <meta name="application-name" content="Dominik Könitzer Portfolio">
    <meta name="msapplication-TileColor" content="#62477f">
    <meta name="msapplication-config" content="/browserconfig.xml">
    <meta name="theme-color" content="#f6f0e6">

    <!-- Geographic SEO -->
    <meta name="geo.region" content="CH-ZH">
    <meta name="geo.country" content="CH">
    <meta name="geo.placename" content="Zürich, Switzerland">
    <meta name="ICBM" content="47.3769, 8.5417">
    <meta name="geo.position" content="47.3769;8.5417">

    <!-- NOTE: canonical is injected per-route by react-helmet (see SEO.tsx).
         Do NOT add a static <link rel="canonical"> here: this file is the
         shared shell, so one here would claim the home URL on every route and
         produce "multiple conflicting canonical URLs". Per-route canonicals are
         emitted into dist/<route>/index.html by scripts/prerender.ts, so the
         served home document does carry <link rel="canonical"
         href="https://dk.punds.ch/">. -->

    <!-- Identity / Webmentions / IndieWeb -->
    <link rel="me" href="https://github.com/dominikkoenitzer">
    <link rel="author" href="https://dk.punds.ch/about">

    <!-- Sitemap & feeds -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">

    <!-- AI / LLM discovery (llms.txt convention) -->
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt">
    <link rel="alternate" type="text/plain" title="llms-full.txt" href="/llms-full.txt">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dk.punds.ch/">
    <meta property="og:title" content="Software Engineer &amp; Web Developer in Zürich | Dominik Könitzer">
    <meta
      property="og:description"
      content="Dominik Könitzer, a software engineer in Zürich building web apps with React, TypeScript and Node. Live projects, source code and services."
    >
    <meta property="og:image" content="https://dk.punds.ch/og-image.png">
    <meta property="og:image:secure_url" content="https://dk.punds.ch/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Dominik Könitzer, software engineer portfolio">
    <meta property="og:site_name" content="Dominik Könitzer">
    <!-- One URL serves every language (the switcher is client-side), so these
         are og:locale:alternate rather than hreflang: there is no separate
         per-language URL for an alternate link to point at. -->
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="de_CH">
    <meta property="og:locale:alternate" content="fr_CH">
    <meta property="og:locale:alternate" content="zh_CN">
    <meta property="og:see_also" content="https://github.com/dominikkoenitzer">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://dk.punds.ch/">
    <meta name="twitter:title" content="Software Engineer &amp; Web Developer in Zürich | Dominik Könitzer">
    <meta
      name="twitter:description"
      content="Dominik Könitzer, a software engineer in Zürich building web apps with React, TypeScript and Node. Live projects, source code and services."
    >
    <meta name="twitter:image" content="https://dk.punds.ch/og-image.png">
    <meta name="twitter:image:alt" content="Dominik Könitzer, software engineer portfolio">
    <!-- No X/Twitter account: twitter:card still renders rich link previews without a handle -->

    <!-- Dublin Core (helps generic crawlers + AI entity recognition) -->
    <meta name="DC.title" content="Dominik Könitzer, Software Engineer Portfolio">
    <meta name="DC.creator" content="Dominik Könitzer">
    <meta name="DC.subject" content="Software Engineering, Web Development, React, TypeScript, Next.js">
    <meta name="DC.description" content="Portfolio of Dominik Könitzer, a software engineer specializing in modern web development.">
    <meta name="DC.publisher" content="Dominik Könitzer">
    <meta name="DC.contributor" content="Dominik Könitzer">
    <meta name="DC.type" content="InteractiveResource">
    <meta name="DC.format" content="text/html">
    <meta name="DC.identifier" content="https://dk.punds.ch/">
    <meta name="DC.language" content="en">
    <meta name="DC.coverage" content="Switzerland">
    <meta name="DC.rights" content="© Dominik Könitzer">

    <!-- JSON-LD structured data. Search engines and LLMs read these as
         ground-truth entity facts. Validated on every build by
         scripts/validate-jsonld.ts. -->

    <!-- Person (primary entity) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "@id": "https://dk.punds.ch/#person",
      "name": "Dominik Könitzer",
      "alternateName": ["Dominik Konitzer", "D. Könitzer"],
      "url": "https://dk.punds.ch",
      "image": {
        "@type": "ImageObject",
        "url": "https://dk.punds.ch/avatar.jpg",
        "width": 460,
        "height": 460
      },
      "sameAs": [
        "https://github.com/dominikkoenitzer"
      ],
      "jobTitle": "Software Engineer",
      "email": "dominik.koenitzer@gmail.com",
      "description": "Swiss software engineer specializing in modern web development with React, TypeScript, Next.js and full-stack engineering. Currently open to software engineering roles, internships, and freelance opportunities, in Switzerland or remote.",
      "knowsLanguage": ["en", "de", "zh", "fr"],
      "knowsAbout": [
        "Software Engineering",
        "Web Development",
        "React",
        "Next.js",
        "TypeScript",
        "JavaScript",
        "Node.js",
        "Java",
        "Spring Framework",
        "Full-Stack Development",
        "Frontend Architecture",
        "DevOps",
        "Docker",
        "PostgreSQL",
        "MongoDB"
      ],
      "nationality": {
        "@type": "Country",
        "name": "Switzerland"
      },
      "hasOccupation": {
        "@type": "Occupation",
        "name": "Software Engineer",
        "occupationalCategory": "15-1252.00",
        "occupationLocation": { "@type": "Country", "name": "Switzerland" },
        "skills": "React, Next.js, TypeScript, JavaScript, Node.js, Java, Spring Framework, Full-Stack Development, Docker, PostgreSQL"
      },
      "seeks": {
        "@type": "Demand",
        "name": "Software engineering roles, internships, and freelance opportunities"
      },
      "alumniOf": {
        "@type": "EducationalOrganization",
        "name": "WISS Schulen für Wirtschaft Informatik Immobilien",
        "url": "https://www.wiss.ch"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "CH",
        "addressRegion": "Zürich",
        "addressLocality": "Zürich"
      },
      "worksFor": { "@id": "https://dk.punds.ch/#organization" }
    }
    </script>

    <!-- WebSite (site identity + entity graph links) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://dk.punds.ch/#website",
      "name": "Dominik Könitzer Portfolio",
      "alternateName": "Dominik Könitzer, Software Engineer",
      "url": "https://dk.punds.ch",
      "description": "Portfolio of Dominik Könitzer, a Swiss software engineer specializing in modern web development.",
      "inLanguage": ["en", "de", "fr", "zh"],
      "publisher": { "@id": "https://dk.punds.ch/#person" },
      "author": { "@id": "https://dk.punds.ch/#person" },
      "copyrightHolder": { "@id": "https://dk.punds.ch/#person" }
    }
    </script>

    <!-- ProfessionalService for local / geo SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://dk.punds.ch/#service",
      "name": "Dominik Könitzer Software Engineering Services",
      "description": "Professional software engineering and web development services delivered from Switzerland to clients worldwide.",
      "url": "https://dk.punds.ch",
      "image": "https://dk.punds.ch/og-image.png",
      "priceRange": "CHF 30-500",
      "email": "dominik.koenitzer@gmail.com",
      "provider": { "@id": "https://dk.punds.ch/#person" },
      "areaServed": [
        { "@type": "Country", "name": "Switzerland" },
        { "@type": "Place", "name": "Europe" },
        { "@type": "Place", "name": "Worldwide" }
      ],
      "serviceType": [
        "Web Development",
        "Software Engineering",
        "Frontend Development",
        "Backend Development",
        "Full-Stack Development",
        "React Development",
        "TypeScript Development",
        "Website Maintenance",
        "SEO Optimization",
        "Custom Software Development"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "CH",
        "addressRegion": "Zürich",
        "addressLocality": "Zürich"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 47.3769,
        "longitude": 8.5417
      }
    }
    </script>

    <!-- Organization (so AI crawlers can link the brand) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://dk.punds.ch/#organization",
      "name": "Dominik Könitzer",
      "alternateName": "Dominik Könitzer Portfolio",
      "url": "https://dk.punds.ch",
      "logo": {
        "@type": "ImageObject",
        "url": "https://dk.punds.ch/android-chrome-512x512.png",
        "width": 512,
        "height": 512
      },
      "founder": { "@id": "https://dk.punds.ch/#person" },
      "sameAs": ["https://github.com/dominikkoenitzer"],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "dominik.koenitzer@gmail.com",
        "availableLanguage": ["English", "German", "Chinese", "French"]
      }
    }
    </script>

    <style>
    /* Critical CSS to prevent any background color issues */
    html,
    body {
      background-color: hsl(var(--background)) !important;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }

    /* Fixed background layer that covers everything including overscroll */
    html::before {
      content: "";
      position: fixed;
      top: -100vh;
      left: -100vw;
      right: -100vw;
      bottom: -100vh;
      width: 300vw;
      height: 300vh;
      background-color: hsl(var(--background));
      z-index: -999999;
      pointer-events: none;
    }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
